deploy-prod:

```
if: github.ref == 'refs/heads/master'
needs: build-test-scan
runs-on: ubuntu-latest
environment: prod

steps:

  - uses: actions/checkout@v4

  - uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Configure EKS
    run: |
      aws eks update-kubeconfig \
      --name ${{ secrets.EKS_CLUSTER_NAME }}

  - name: Deploy PROD
    run: |
      kubectl apply -f k8s/prod/ -n ${{ secrets.NAMESPACE }}

  - name: Dynatrace Deployment Event
    run: |
      curl -X POST \
      "${{ secrets.DYNATRACE_ENV_URL }}/api/v2/events/ingest" \
      -H "Authorization: Api-Token ${{ secrets.DYNATRACE_API_TOKEN }}" \
      -H "Content-Type: application/json" \
      -d '{
            "eventType":"CUSTOM_DEPLOYMENT",
            "title":"GitHub Production Deployment"
          }'
```
