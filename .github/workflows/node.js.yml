name: Enterprise Java Spring Boot CI/CD

on:
push:
branches:
- dev
- qa
- preprod
- master

permissions:
contents: read

env:
JAVA_VERSION: "17"
IMAGE_NAME: springboot-app

jobs:

build-test-scan:
runs-on: ubuntu-latest

```
outputs:
  image-tag: ${{ github.run_number }}

steps:

  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: ${{ env.JAVA_VERSION }}

  - name: Cache Maven Repository
    uses: actions/cache@v4
    with:
      path: ~/.m2/repository
      key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

  - name: Maven Clean Build
    run: mvn clean package

  - name: Unit Test Execution
    run: mvn test

  - name: SonarQube Analysis
    run: |
      mvn sonar:sonar \
      -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
      -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  - name: Sonar Quality Gate
    uses: sonarsource/sonarqube-quality-gate-action@master
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  - name: Install FOSSA
    run: |
      curl -H "Cache-Control: no-cache" \
      https://raw.githubusercontent.com/fossas/fossa-cli/master/install.sh | bash

  - name: FOSSA Scan
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    run: |
      fossa analyze
      fossa test

  - name: Trivy Filesystem Scan
    uses: aquasecurity/trivy-action@master
    with:
      scan-type: fs
      scan-ref: .

  - name: Login To JFrog Docker Registry
    run: |
      docker login ${{ secrets.JFROG_DOCKER_REGISTRY }} \
      -u ${{ secrets.JFROG_USERNAME }} \
      -p ${{ secrets.JFROG_PASSWORD }}

  - name: Build Docker Image
    run: |
      docker build \
      -t ${{ secrets.JFROG_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} .

  - name: Trivy Container Scan
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: ${{ secrets.JFROG_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  - name: Push Docker Image
    run: |
      docker push \
      ${{ secrets.JFROG_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  - name: JFrog CLI Setup
    uses: jfrog/setup-jfrog-cli@v4

  - name: Configure JFrog
    run: |
      jf c add artifactory \
      --url=${{ secrets.JFROG_URL }} \
      --user=${{ secrets.JFROG_USERNAME }} \
      --password=${{ secrets.JFROG_PASSWORD }} \
      --interactive=false

  - name: JFrog Xray Scan
    run: |
      jf docker scan \
      ${{ secrets.JFROG_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  - name: Publish Build Info
    run: |
      jf rt build-collect-env
      jf rt build-publish
```

deploy-dev:
if: github.ref == 'refs/heads/dev'
needs: build-test-scan
runs-on: ubuntu-latest
environment: dev

```
steps:

  - uses: actions/checkout@v4

  - uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Configure EKS
    run: |
      aws eks update-kubeconfig \
      --name ${{ secrets.EKS_CLUSTER_NAME }}

  - name: Helm Deploy DEV
    run: |
      helm upgrade --install springboot-app ./helm \
      --namespace ${{ secrets.NAMESPACE }} \
      --create-namespace \
      --set image.repository=${{ secrets.JFROG_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }} \
      --set image.tag=${{ github.run_number }}
```

