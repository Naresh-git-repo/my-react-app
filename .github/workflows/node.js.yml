name: Enterprise Java Spring Boot CI/CD

on:
push:
branches:
- dev
- qa
- preprod
- master

permissions:
contents: read

env:
JAVA_VERSION: '17'

jobs:

build-test-scan:

```
runs-on: ubuntu-latest

outputs:
  artifact-name: springboot-artifact

steps:

  - name: Checkout Source
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: ${{ env.JAVA_VERSION }}

  - name: Cache Maven Repository
    uses: actions/cache@v4
    with:
      path: ~/.m2/repository
      key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

  - name: Maven Clean Package
    run: mvn clean package -DskipTests

  - name: Run Unit Tests
    run: mvn test

  - name: SonarQube Analysis
    run: |
      mvn sonar:sonar \
      -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
      -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  - name: Install FOSSA
    run: |
      curl -H "Cache-Control: no-cache" \
      https://raw.githubusercontent.com/fossas/fossa-cli/master/install.sh | bash

  - name: Run FOSSA Scan
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    run: |
      fossa analyze
      fossa test

  - name: Upload JAR to JFrog
    run: |
      curl -u "${{ secrets.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }}" \
      -T target/*.jar \
      "${{ secrets.JFROG_URL }}/libs-release-local/"

  - name: Upload Build Artifact
    uses: actions/upload-artifact@v4
    with:
      name: springboot-artifact
      path: target/*.jar
```

deploy-dev:

```
if: github.ref == 'refs/heads/dev'
needs: build-test-scan
runs-on: ubuntu-latest
environment: dev

steps:

  - uses: actions/checkout@v4

  - uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Configure EKS
    run: |
      aws eks update-kubeconfig \
      --name ${{ secrets.EKS_CLUSTER_NAME }}

  - name: Deploy DEV
    run: |
      kubectl apply -f k8s/dev/ -n ${{ secrets.NAMESPACE }}
```

