deploy-prod:
if: github.ref == 'refs/heads/master'
needs: build-test-scan
runs-on: ubuntu-latest
environment: prod

```
steps:

  - uses: actions/checkout@v4

  - uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Configure EKS
    run: |
      aws eks update-kubeconfig \
      --name ${{ secrets.EKS_CLUSTER_NAME }}

  - name: Helm Deploy PROD
    run: |
      helm upgrade --install springboot-app ./helm \
      --namespace ${{ secrets.NAMESPACE }} \
      --create-namespace \
      --set image.repository=${{ secrets.JFROG_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }} \
      --set image.tag=${{ github.run_number }}

  - name: Dynatrace Deployment Marker
    run: |
      curl -X POST \
      "${{ secrets.DYNATRACE_ENV_URL }}/api/v2/events/ingest" \
      -H "Authorization: Api-Token ${{ secrets.DYNATRACE_API_TOKEN }}" \
      -H "Content-Type: application/json" \
      -d '{"eventType":"CUSTOM_DEPLOYMENT","title":"Production Deployment"}'

  - name: Slack Notification
    uses: slackapi/slack-github-action@v1.27.0
    with:
      payload: |
        {
          "text": "Production deployment completed successfully for build #${{ github.run_number }}"
        }
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
```
