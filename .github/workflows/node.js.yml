name: Enterprise React CI/CD

on:
  push:
    branches:
      - dev
      - qa
      - preprod
      - master

permissions:
  contents: read

env:
  IMAGE_NAME: react-app

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.run_number }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Run Tests
        run: npm test -- --watchAll=false

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build-test-scan
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Configure EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }}
      - name: Helm Deploy
        run: |
          helm upgrade --install react-app ./helm \
          --namespace ${{ secrets.NAMESPACE }} --create-namespace \
          --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }} \
          --set image.tag=${{ github.run_number }}

  deploy-qa:
    if: github.ref == 'refs/heads/qa'
    needs: build-test-scan
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Configure EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }}
      - name: Helm Deploy
        run: |
          helm upgrade --install react-app ./helm \
          --namespace ${{ secrets.NAMESPACE }} --create-namespace \
          --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }} \
          --set image.tag=${{ github.run_number }}

  deploy-preprod:
    if: github.ref == 'refs/heads/preprod'
    needs: build-test-scan
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Configure EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }}
      - name: Helm Deploy
        run: |
          helm upgrade --install react-app ./helm \
          --namespace ${{ secrets.NAMESPACE }} --create-namespace \
          --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }} \
          --set image.tag=${{ github.run_number }}

  deploy-prod:
    if: github.ref == 'refs/heads/master'
    needs: build-test-scan
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Configure EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }}
      - name: Helm Deploy
        run: |
          helm upgrade --install react-app ./helm \
          --namespace ${{ secrets.NAMESPACE }} --create-namespace \
          --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }} \
          --set image.tag=${{ github.run_number }}

      - name: Dynatrace Deployment Marker
        run: |
          curl -X POST "${{ secrets.DYNATRACE_ENV_URL }}/api/v2/events/ingest" \
          -H "Authorization: Api-Token ${{ secrets.DYNATRACE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "eventType": "CUSTOM_DEPLOYMENT",
            "title": "Production Deployment",
            "entitySelector": "type(SERVICE),tag(production)",
            "properties": {
              "DeploymentVersion": "${{ github.run_number }}"
            }
          }'

      - name: Slack Notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: '{"text": "Production deployment completed successfully for build #${{ github.run_number }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
